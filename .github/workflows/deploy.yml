name: Atualizar feed e publicar

on:
  push:
    branches: [main]
  schedule:
    # Todo dia às 06:00 UTC (03:00 horário de Brasília) — antes era só
    # segunda-feira, mas o catálogo de livros da Amazon (PA-API) precisa
    # atualizar no máximo a cada 24h por exigência do próprio termo de uso
    # da Amazon Associates. Como o deploy sempre republica o dist/ inteiro,
    # Awin e Grupo Boticário passam a ser rebuscados junto, todo dia também
    # (efeito colateral aceito — sem custo conhecido até agora).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Pular o fetch do feed (reusa o último catálogo salvo em cache — rápido, só pra mudança de código/UI que não depende de dado novo)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # public/data/ é gitignorado (catálogo inteiro, centenas de MB) — sem
      # esse cache, todo run começa do zero e precisa rebuscar tudo. A chave
      # de salvar é sempre única (run_id), então todo run deixa um cache novo;
      # restore-keys pega o mais recente disponível na restauração. Só tem
      # efeito prático quando skip_fetch=true (abaixo) — nos outros casos o
      # fetch de qualquer forma sobrescreve o que foi restaurado.
      - name: Cache do catálogo (public/data)
        uses: actions/cache@v4
        with:
          path: public/data
          key: catalogo-${{ github.run_id }}
          restore-keys: catalogo-

      - name: Baixar feed e gerar JSON + build
        env:
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          AWIN_PROMOTIONS_TOKEN: ${{ secrets.AWIN_PROMOTIONS_TOKEN }}
          OUIPARIS_USER_ID: ${{ secrets.OUIPARIS_USER_ID }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          SHOPEE_FEED_URL: ${{ secrets.SHOPEE_FEED_URL }}
          # Domínio próprio (CNAME) serve a partir da raiz, não de /repo-name/.
          VITE_BASE_PATH: /
          SITE_URL: https://comprar.blendibox.com.br
        run: |
          # skip_fetch só existe em disparo manual (workflow_dispatch) — em
          # push/schedule essa entrada nem existe, então a comparação abaixo
          # cai sempre no fetch completo (comportamento de hoje, inalterado).
          # Verifica o arquivo de verdade (não só a flag) porque o cache pode
          # não ter nada restaurável ainda (primeiro run, ou cache expirado).
          if [ "${{ github.event.inputs.skip_fetch }}" = "true" ] && [ -f public/data/index.json ]; then
            echo "skip_fetch ativado e catálogo em cache encontrado — pulando fetch, só rebuild."
            npm run build:no-fetch
          else
            npm run build
          fi

      # Só no cron diário (ou disparo manual) — NUNCA em push. Sem essa
      # restrição, qualquer commit em main (várias vezes ao dia durante
      # desenvolvimento normal) geraria e publicaria um vídeo novo no
      # YouTube, além do vídeo do cron. Um vídeo por dia é o objetivo.
      #
      # continue-on-error em todos os três: o site (build + deploy no Pages)
      # é o núcleo do projeto e não pode ficar refém de um problema no
      # pipeline de vídeo/YouTube — se algo falhar aqui, os steps seguintes
      # (commit do histórico, deploy do site) continuam normalmente.
      #
      # timeout-minutes aqui é o que faz o continue-on-error valer de
      # verdade: sem ele, um apt-get preso tentando um espelho fora do ar
      # trava a fila inteira (visto ao vivo — 50+ min parado em "Instalar
      # ffmpeg", nada depois rodou, nem o deploy do site) — continue-on-error
      # só reage depois que o passo termina, não enquanto está travado.
      - name: Instalar ffmpeg
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Gerar vídeo diário
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run daily-video

      - name: Publicar vídeo no YouTube
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID" ]; then
            echo "Secrets do YouTube ainda não configurados (Settings > Secrets and variables > Actions) — pulando upload."
            exit 0
          fi
          npm run upload-video

      # Mesmo vídeo, mesmo momento do YouTube — não espera os horários de
      # 12h15/19h30 do canal (esses são só pras ofertas avulsas/resumo).
      - name: Publicar vídeo no Telegram
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Secrets do Telegram ainda não configurados (Settings > Secrets and variables > Actions) — pulando."
            exit 0
          fi
          npm run telegram-video

      - name: Commitar histórico de preços atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price-history.json data/price-drops-today.json
          git diff --cached --quiet || git commit -m "chore: atualiza histórico de preços [skip ci]"
          git push

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job separado, só depois que o site já está no ar de verdade — o
  # protocolo IndexNow (Bing/Yandex/Seznam/Naver; o Google não participa)
  # confere a chave em SITE_URL/{key}.txt na hora que recebe o aviso, então
  # precisa que o Pages já tenha publicado o dist/ novo antes de avisar.
  # Só no cron/disparo manual, nunca em push (mesmo motivo do vídeo — não
  # faz sentido avisar buscador externo a cada commit de desenvolvimento).
  notify-indexnow:
    needs: deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Avisar IndexNow (Bing/Yandex) das URLs que mudaram hoje
        continue-on-error: true
        env:
          SITE_URL: https://comprar.blendibox.com.br
        run: node scripts/submit-indexnow.mjs
