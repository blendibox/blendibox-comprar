name = "blendibox-newsletter"
main = "newsletter-worker.js"
compatibility_date = "2026-01-01"

# Toda segunda-feira às 8h UTC (5h Brasília) — 2h depois do primeiro
# workflow do site do dia (deploy.yml roda todo dia às 6h UTC desde a
# integração com a Amazon/Shopee), tempo suficiente pro digest.json mais
# recente já estar publicado no GitHub Pages antes do Worker buscar.
#
# O teste pontual de 14/07 (data fixa "0 8 14 7 *", só disparava uma vez)
# nunca foi revertido pra essa expressão recorrente — motivo pelo qual o
# broadcast parou de sair depois daquele disparo único. Corrigido em
# 2026-07-22.
#
# Segundo cron (09:00 UTC, todo dia) roda a checagem de aviso de queda de
# preço — 3h depois do build diário (deploy.yml, 06h UTC), tempo suficiente
# pro price-drops.json mais recente já estar publicado no GitHub Pages. O
# handler `scheduled` do Worker distingue as duas rotinas por `event.cron`.
[triggers]
crons = ["0 8 * * 1", "0 9 * * *"]

[vars]
ALLOWED_ORIGIN = "https://comprar.blendibox.com.br"
SITE_URL = "https://comprar.blendibox.com.br"
RESEND_SEGMENT_ID = "0236b828-d608-4a80-8216-f2d8d224969b"
DIGEST_FROM_EMAIL = "Compare Ofertas <ofertas@blendibox.com.br>"

# RESEND_API_KEY e RESEND_AUDIENCE_ID são secrets — configure com:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_AUDIENCE_ID

# KV pra guardar quem pediu aviso de queda de preço de qual produto (ver
# handleWatch/checkPriceDropsAndNotify em newsletter-worker.js). Crie o
# namespace primeiro (`wrangler kv namespace create PRICE_WATCH`) e cole o id
# retornado abaixo antes do deploy.
[[kv_namespaces]]
binding = "PRICE_WATCH"
id = "8461f3dc2b4246d0a0e89625c45b6a42"

# D1 da lista de presentes (Fase 1). Schema em worker/registry-schema.sql,
# aplicado com `wrangler d1 execute blendibox-registry --file=... --remote`.
[[d1_databases]]
binding = "REGISTRY_DB"
database_name = "blendibox-registry"
database_id = "96c615a2-78a6-4aa8-b408-24db37f5b690"
